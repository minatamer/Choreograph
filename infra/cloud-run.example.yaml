# Separate schema-release identity. Creating this Job would not execute it.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: REPLACE_MIGRATE_JOB_NAME
  namespace: "REPLACE_PROJECT_NUMBER"
  labels:
    cloud.googleapis.com/location: REPLACE_REGION
  annotations:
    run.googleapis.com/description: UNCONFIGURED - explicitly authorized schema release only
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: REPLACE_PROJECT_ID:REPLACE_REGION:REPLACE_SQL_INSTANCE
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          maxRetries: 0
          timeoutSeconds: "300"
          serviceAccountName: REPLACE_MIGRATE_SA@REPLACE_PROJECT_ID.iam.gserviceaccount.com
          containers:
            - image: REPLACE_REGION-docker.pkg.dev/REPLACE_PROJECT_ID/REPLACE_REPOSITORY/backend@sha256:REPLACE_BACKEND_IMAGE_DIGEST
              command: [python, -m, choreograph.release]
              args: [migrate]
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: FAKE_MODE
                  value: "true"
                - name: PAID_DEMO_ENABLED
                  value: "false"
                - name: CHOREOGRAPH_ORIGIN
                  value: https://REPLACE_FRONTEND_SERVICE_ORIGIN.run.app
                - name: CHOREOGRAPH_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: REPLACE_MIGRATION_DATABASE_URL_SECRET_NAME
                      key: "REPLACE_PINNED_MIGRATION_DATABASE_URL_SECRET_VERSION"
                # Settings validation needs these fields; migration does not
                # use guest encryption/signing. Supply valid throwaway values,
                # not access to the application's guest key/bridge secrets.
                - name: CHOREOGRAPH_BRIDGE_SECRET
                  value: REPLACE_THROWAWAY_SETTINGS_ONLY_32_PLUS_CHARACTERS
                - name: CHOREOGRAPH_TOKEN_KEY
                  value: REPLACE_THROWAWAY_SETTINGS_ONLY_BASE64URL_32_BYTES
---
