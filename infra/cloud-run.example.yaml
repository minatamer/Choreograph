# UNCONFIGURED REVIEW EXAMPLES ONLY. No resource has been provisioned/deployed.
# Replace every REPLACE_* identifier after owner authorization and cost review.
# This fake-provider hosted QA profile is not ready for public real-provider use.
# IAM policy additions are separately described in iam.example.json.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: REPLACE_FRONTEND_SERVICE_NAME
  namespace: "REPLACE_PROJECT_NUMBER"
  labels:
    cloud.googleapis.com/location: REPLACE_REGION
  annotations:
    run.googleapis.com/description: UNCONFIGURED - restricted fake-provider QA frontend
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "false"
    run.googleapis.com/minScale: "0"
    run.googleapis.com/maxScale: "2"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: REPLACE_FRONTEND_SA@REPLACE_PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 90
      containers:
        - image: REPLACE_REGION-docker.pkg.dev/REPLACE_PROJECT_ID/REPLACE_REPOSITORY/frontend@sha256:REPLACE_FRONTEND_IMAGE_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: CHOREOGRAPH_ORIGIN
              value: https://REPLACE_FRONTEND_SERVICE_ORIGIN.run.app
            - name: CHOREOGRAPH_API_URL
              value: https://REPLACE_API_SERVICE_ORIGIN.run.app
            - name: CHOREOGRAPH_API_AUTH
              value: google
            - name: CHOREOGRAPH_API_AUDIENCE
              value: https://REPLACE_API_SERVICE_ORIGIN.run.app
            - name: CHOREOGRAPH_BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: REPLACE_BRIDGE_SECRET_NAME
                  key: "REPLACE_PINNED_BRIDGE_SECRET_VERSION"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 20
  traffic:
    - latestRevision: true
      percent: 100
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: REPLACE_API_SERVICE_NAME
  namespace: "REPLACE_PROJECT_NUMBER"
  labels:
    cloud.googleapis.com/location: REPLACE_REGION
  annotations:
    run.googleapis.com/description: UNCONFIGURED - private fake-provider guest API
    # IAM is mandatory. "all" ingress permits authenticated Cloud Run callers
    # without inventing a VPC/network path; it does not grant public invocation.
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "false"
    run.googleapis.com/minScale: "0"
    run.googleapis.com/maxScale: "2"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: REPLACE_PROJECT_ID:REPLACE_REGION:REPLACE_SQL_INSTANCE
    spec:
      serviceAccountName: REPLACE_API_SA@REPLACE_PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 90
      containers:
        - image: REPLACE_REGION-docker.pkg.dev/REPLACE_PROJECT_ID/REPLACE_REPOSITORY/backend@sha256:REPLACE_BACKEND_IMAGE_DIGEST
          command: [python, -m, choreograph.release]
          args: [api]
          ports:
