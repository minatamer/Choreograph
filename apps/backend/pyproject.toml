[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "choreograph-api"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["choreograph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "SIM"]
# Retain the repository's compact source layout; this gate targets correctness,
# imports and demonstrated idioms rather than a wholesale formatting rewrite.
ignore = ["E701", "E702"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
# Keep classification identical from the repository and backend working directories.
known-first-party = ["choreograph"]
